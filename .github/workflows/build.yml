name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant (debug recommended for sideloaded phone with App Check Debug Token; release for Play Store)"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare fixed signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Decoding signing keystore from GitHub Secret (DEBUG_KEYSTORE_BASE64)..."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding fixed signing keystore from repository debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using existing debug.keystore in repository..."
          else
            echo "::error::Missing fixed signing keystore! Add DEBUG_KEYSTORE_BASE64 in GitHub Secrets or include debug.keystore.base64 from AI Studio so the APK SHA-1 matches Firebase Google Sign-In."
            exit 1
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Writing app/google-services.json from GitHub Secret (GOOGLE_SERVICES_JSON)..."
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f app/google-services.json ]; then
            echo "Using existing app/google-services.json in repository..."
          elif [ -f app/src/debug/google-services.json ]; then
            echo "Copying app/src/debug/google-services.json to app/google-services.json..."
            cp app/src/debug/google-services.json app/google-services.json
          else
            echo "::error::Missing app/google-services.json! Add its contents as a GitHub Actions Secret named GOOGLE_SERVICES_JSON (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Build APK
        run: |
          gradle wrapper && chmod +x gradlew
          if [ "${{ inputs.build_type || 'debug' }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/${{ inputs.build_type || 'debug' }}/*.apk
