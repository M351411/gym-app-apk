name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "متابعي" "com.gymapp.app" --web-dir www
          npx cap add android
      - name: App icon (best effort)
        continue-on-error: true
        run: |
          mkdir -p assets
          cp www/icon-512.png assets/icon-only.png
          npm i @capacitor/assets@3
          npx capacitor-assets generate --android
      - name: Build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk